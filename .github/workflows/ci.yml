name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Pytest
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t app .
      - name: Run image without config (expects a clear error, exit code 2)
        run: |
          set +e
          docker run --rm app > out.txt 2>&1
          code=$?
          cat out.txt
          test "$code" -eq 2 && grep -q "OPENROUTER_API_KEY" out.txt

  smoke-eval:
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ vars.EVAL_MODEL }}
      MODEL_PRIMARY: ${{ vars.MODEL_PRIMARY }}
    steps:
      - name: Skip notice
        if: env.OPENROUTER_API_KEY == ''
        run: echo "OPENROUTER_API_KEY secret not set; skipping smoke eval."
      - uses: actions/checkout@v7
        if: env.OPENROUTER_API_KEY != ''
      - uses: actions/setup-python@v7
        if: env.OPENROUTER_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: env.OPENROUTER_API_KEY != ''
        run: python -m pip install -e .
      - name: Run smoke eval (5 emails)
        if: env.OPENROUTER_API_KEY != ''
        run: python -m evals.run --smoke --min-accuracy 0.7
